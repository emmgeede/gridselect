name: Pull request rules
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CHANGELOG and README updated, version untouched, no dependencies, no local files
      - run: node scripts/pr-check.js "origin/${{ github.base_ref }}"
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
