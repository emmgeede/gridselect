# Publishes to npm when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
# Uses npm Trusted Publishing (OIDC): no token is stored anywhere, and npm records a provenance
# statement that the package was built from this repository by this workflow.
# One-time setup on npmjs.com: package -> Settings -> Trusted Publisher -> GitHub Actions,
# user "emmgeede", repository "gridselect", workflow "publish.yml".
name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx playwright install --with-deps chromium
      # prepublishOnly runs the unit tests and the build; the browser tests run here as well.
      - run: npm run test:e2e
      - run: npm publish --provenance --access public
